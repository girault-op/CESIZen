name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - trunk
      - master
  pull_request:
    branches:
      - develop
      - trunk
      - master

jobs:
  # Job 1 : Exécuter les tests
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, pdo, bcmath
        coverage: none

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Set up database
      run: |
        cp .env.example .env
        php artisan key:generate
        touch database/database.sqlite
        php artisan migrate --force

    - name: Run tests
      run: php artisan test

  # Job 2 : Déploiement conditionnel
  deploy:
    runs-on: ubuntu-latest
    needs: test # Ce job ne s'exécute que si les tests réussissent

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to develop environment
      if: github.ref == 'refs/heads/develop'
      run: |
        echo "Déploiement en cours pour l'environnement DEVELOP..."
        # Ajoutez ici vos commandes de déploiement pour l'environnement develop

    - name: Deploy to re7 environment
      if: github.ref == 'refs/heads/trunk'
      run: |
        echo "Déploiement en cours pour l'environnement RE7..."
        # Ajoutez ici vos commandes de déploiement pour l'environnement re7

    - name: Deploy to production environment
      if: github.ref == 'refs/heads/master'
      run: |
        echo "Déploiement en cours pour l'environnement PROD..."
        # Ajoutez ici vos commandes de déploiement pour l'environnement prod
