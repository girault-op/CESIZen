name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - re7
      - prod
  pull_request:
    branches:
      - dev
      - re7
      - prod

jobs:
  # Job 1 : Exécuter les tests
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, pdo, bcmath
        coverage: none

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Set up database
      run: |
        cp .env.example .env
        php artisan key:generate
        touch database/database.sqlite
        php artisan migrate --force

    - name: Run tests
      run: php artisan test

  # Job 2 : Déploiement conditionnel
  deploy:
    runs-on: ubuntu-latest
    needs: test # Ce job ne s'exécute que si les tests réussissent

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to environment
      if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/re7'
      run: |
        echo "Déploiement en cours pour la branche ${{ github.ref_name }}..."
        # Ajoutez ici vos commandes de déploiement, par exemple :
        # - Déploiement sur un serveur via SSH
        # - Déploiement sur un service cloud (AWS, Azure, etc.)
